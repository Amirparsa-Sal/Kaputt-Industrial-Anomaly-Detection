exp_name: vlm_zero

# Override inference parameters
shot_mode: zero_shot
mask: false
crop: true
scoring_mode: text
input_size: 1024
num_data: 1500  

system_prompt_text_zero_shot: |-
  You are an expert quality control inspector analyzing products for defects.

user_prompt_text_zero_shot: |-
  Examine this product image carefully for any signs of damage or defect.

  There are 2 types of potential defects:
  1) Structural defects:
  - Penetration: holes, tears, or cuts in packaging or product
  - Deformation: dents, crushes, bent or warped surfaces
  - Deconstruction: detached, collapsed, or disassembled parts
  - Spillage: leaked or spilled contents (liquid, powder, granules)
  - Superficial: surface damage such as dirt marks, scratches, or scuffs

  2) Logical defects:
  - Actuation: inappropriately opened containers (open box, bag, or book)
  - Missing Unit: one or more expected parts or units are absent

  Analyze the image and provide a short explanation, then output a numeric
  anomaly score between 0.0 and 1.0.

  Return EXACTLY in this format:
  ANALYSIS: <brief explanation>
  SCORE: <number between 0.0 and 1.0>

  Do not output DEFECT labels or any additional fields.